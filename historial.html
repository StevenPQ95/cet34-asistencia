<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>CET 34 - Historial de Asistencia</title>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>

  <!-- Seguridad común -->
  <script
    src="https://stevenpq95.github.io/cet34-asistencia/auth.js">
  </script>

  <!-- Encabezado + menú común -->
  <script
    src="https://stevenpq95.github.io/cet34-asistencia/menu.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --vino:#8d183f;
      --vino-oscuro:#650f2f;
      --vino-suave:#f9edf2;

      --azul:#2563eb;
      --azul-suave:#eff6ff;

      --verde:#16a34a;
      --verde-suave:#ecfdf3;

      --amarillo:#d97706;
      --amarillo-suave:#fffbeb;

      --rojo:#dc2626;
      --rojo-suave:#fef2f2;

      --texto:#0f172a;
      --texto-sec:#64748b;

      --fondo:#eef3f8;
      --blanco:#fff;
      --borde:#dbe4ef;

      --sombra:0 10px 28px rgba(15,23,42,.07);
      --sombra-grande:0 20px 45px rgba(15,23,42,.09);
    }

    html,
    body {
      width:100%;
      max-width:100%;
      min-height:100%;
      overflow-x:hidden;
    }

    body {
      margin:0;
      background:var(--fondo);
      color:var(--texto);
      font-family:Arial,Helvetica,sans-serif;
    }

    button,
    input {
      font:inherit;
    }

    button {
      -webkit-tap-highlight-color:transparent;
    }

    .contenedor {
      width:min(1180px,calc(100% - 32px));
      margin:24px auto 55px;
    }

    /* =====================================================
       SEGURIDAD: TODO EL CONTENIDO PRIVADO SE MANTIENE
       OCULTO HASTA QUE auth.js AUTORICE AL USUARIO.
    ====================================================== */

    .contenido-privado {
      display:none;
    }

    .contenido-privado.autorizado {
      display:block;
    }

    /* =====================================================
       ENCABEZADO DE LA SECCIÓN
    ====================================================== */

    .encabezado {
      margin-bottom:18px;
    }

    .encabezado h1 {
      margin:0;
      font-size:30px;
      line-height:1.1;
      font-weight:900;
      letter-spacing:-.7px;
    }

    .encabezado p {
      margin:7px 0 0;
      color:var(--texto-sec);
      font-size:14px;
      line-height:1.45;
    }

    /* =====================================================
       TARJETAS
    ====================================================== */

    .tarjeta {
      background:var(--blanco);
      border:1px solid var(--borde);
      border-radius:22px;
      padding:24px;
      margin-bottom:20px;
      box-shadow:var(--sombra);
    }

    .titulo-seccion {
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-bottom:19px;
    }

    .titulo-icono {
      width:44px;
      height:44px;
      flex:0 0 44px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:13px;
      background:var(--vino-suave);
      font-size:22px;
    }

    .titulo-seccion h2 {
      margin:0;
      font-size:21px;
      font-weight:900;
    }

    .titulo-seccion p {
      margin:4px 0 0;
      color:var(--texto-sec);
      font-size:13px;
      line-height:1.4;
    }

    /* =====================================================
       BUSCADOR
    ====================================================== */

    .buscador-grid {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:end;
    }

    .campo {
      display:flex;
      flex-direction:column;
      gap:7px;
      min-width:0;
    }

    .campo label {
      color:#334155;
      font-size:13px;
      font-weight:800;
    }

    input[type="text"],
    input[type="date"] {
      width:100%;
      min-width:0;
      height:50px;
      padding:0 14px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      background:#fff;
      color:var(--texto);
      outline:none;
      font-size:14px;
    }

    input:focus {
      border-color:var(--azul);
      box-shadow:0 0 0 4px rgba(37,99,235,.10);
    }

    .boton {
      min-height:50px;
      padding:0 19px;
      border:0;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
      transition:transform .18s ease,filter .18s ease,opacity .18s ease;
    }

    .boton:hover {
      transform:translateY(-1px);
      filter:brightness(.98);
    }

    .boton:active {
      transform:none;
    }

    .boton:disabled {
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .boton-vino {
      background:var(--vino);
      color:#fff;
    }

    .boton-azul {
      background:var(--azul);
      color:#fff;
    }

    .rango {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin-top:14px;
    }

    .mensaje {
      display:none;
      margin-top:14px;
      padding:13px 15px;
      border-radius:13px;
      text-align:center;
      line-height:1.4;
      font-size:13px;
      font-weight:800;
    }

    .mensaje.visible {
      display:block;
    }

    .mensaje.info {
      background:var(--azul-suave);
      color:var(--azul);
    }

    .mensaje.exito {
      background:var(--verde-suave);
      color:var(--verde);
    }

    .mensaje.error {
      background:var(--rojo-suave);
      color:var(--rojo);
    }

    /* =====================================================
       RESULTADOS DE BÚSQUEDA
    ====================================================== */

    .resultados {
      display:none;
      margin-top:17px;
    }

    .resultados.visible {
      display:block;
    }

    .resultados-titulo {
      margin-bottom:10px;
      color:#334155;
      font-size:14px;
      font-weight:900;
    }

    .resultado-estudiante {
      width:100%;
      display:grid;
      grid-template-columns:40px minmax(0,1fr) auto;
      align-items:center;
      gap:11px;
      padding:13px;
      margin-bottom:8px;
      border:1px solid var(--borde);
      border-radius:15px;
      background:#fff;
      text-align:left;
      cursor:pointer;
      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .resultado-estudiante:hover {
      background:var(--azul-suave);
      border-color:#bfdbfe;
      transform:translateY(-1px);
    }

    .resultado-icono {
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:var(--azul-suave);
      color:var(--azul);
      font-weight:900;
      font-size:13px;
    }

    .resultado-nombre {
      min-width:0;
      font-size:14px;
      font-weight:900;
      overflow-wrap:anywhere;
    }

    .resultado-datos {
      margin-top:4px;
      color:var(--texto-sec);
      font-size:12px;
    }

    .resultado-flecha {
      color:var(--azul);
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    /* =====================================================
       ESTUDIANTE SELECCIONADO
    ====================================================== */

    .estudiante-seleccionado {
      display:none;
      margin-top:18px;
      padding:17px;
      border:1px solid #dbeafe;
      border-radius:16px;
      background:linear-gradient(135deg,#f8fbff,#eff6ff);
    }

    .estudiante-seleccionado.visible {
      display:block;
    }

    .perfil-linea {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
    }

    .perfil-nombre {
      font-size:20px;
      font-weight:900;
      line-height:1.2;
      overflow-wrap:anywhere;
    }

    .perfil-datos {
      margin-top:5px;
      color:var(--texto-sec);
      font-size:13px;
      line-height:1.45;
    }

    .perfil-codigo {
      flex:0 0 auto;
      padding:7px 10px;
      border-radius:999px;
      background:#fff;
      color:var(--azul);
      border:1px solid #dbeafe;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    /* =====================================================
       REPORTE DEL HISTORIAL
    ====================================================== */

    .historial {
      display:none;
      margin-top:20px;
    }

    .historial.visible {
      display:block;
    }

    .resumen {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      margin-bottom:18px;
    }

    .resumen-item {
      min-width:0;
      min-height:90px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border:1px solid #e5ebf2;
      border-radius:15px;
      background:#f8fafc;
      text-align:center;
    }

    .resumen-numero {
      font-size:28px;
      line-height:1;
      font-weight:900;
      margin-bottom:7px;
    }

    .resumen-etiqueta {
      color:var(--texto-sec);
      font-size:11px;
      font-weight:800;
    }

    .verde {
      color:var(--verde);
    }

    .amarillo {
      color:var(--amarillo);
    }

    .azul {
      color:var(--azul);
    }

    .rojo {
      color:var(--rojo);
    }

    /* =====================================================
       CABECERA DEL HISTORIAL
    ====================================================== */

    .historial-cabecera {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:13px;
    }

    .historial-cabecera h2 {
      margin:0;
      font-size:20px;
      font-weight:900;
    }

    .periodo {
      color:var(--texto-sec);
      font-size:12px;
      text-align:right;
    }

    /* =====================================================
       DÍAS
    ====================================================== */

    .dia {
      border:1px solid var(--borde);
      border-radius:16px;
      margin-bottom:9px;
      overflow:hidden;
      background:#fff;
    }

    .dia-cabecera {
      width:100%;
      min-height:66px;
      display:grid;
      grid-template-columns:44px minmax(0,1fr) auto 30px;
      align-items:center;
      gap:10px;
      padding:10px 13px;
      border:0;
      background:#fff;
      text-align:left;
      cursor:pointer;
    }

    .dia-cabecera:hover {
      background:#f8fafc;
    }

    .dia-icono {
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:#f8fafc;
      color:#475569;
      font-size:18px;
    }

    .dia-fecha {
      min-width:0;
      font-size:14px;
      font-weight:900;
    }

    .dia-subtexto {
      margin-top:3px;
      color:var(--texto-sec);
      font-size:11px;
      line-height:1.35;
    }

    .estado {
      padding:7px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .estado-presente {
      background:var(--verde-suave);
      color:var(--verde);
    }

    .estado-tardanza {
      background:var(--amarillo-suave);
      color:var(--amarillo);
    }

    .estado-pendiente {
      background:var(--azul-suave);
      color:var(--azul);
    }

    .estado-falta {
      background:var(--rojo-suave);
      color:var(--rojo);
    }

    .flecha {
      width:30px;
      height:30px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      background:transparent;
      transition:background .22s ease,color .22s ease;
    }

    .flecha-icono {
      width:10px;
      height:10px;
      border-right:2.5px solid currentColor;
      border-bottom:2.5px solid currentColor;
      transform:rotate(45deg);
      transform-origin:center center;
      transition:transform .25s cubic-bezier(.4,0,.2,1);
    }

    .dia.abierto .flecha {
      background:var(--azul-suave);
      color:var(--azul);
    }

    .dia.abierto .flecha-icono {
      transform:rotate(225deg);
    }

    .dia-detalle {
      display:none;
      padding:0 13px 14px;
      border-top:1px solid #edf2f7;
    }

    .dia.abierto .dia-detalle {
      display:block;
    }

    .detalle-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
      padding-top:13px;
    }

    .detalle-item {
      min-width:0;
      padding:12px;
      border:1px solid #e2e8f0;
      border-radius:13px;
      background:#fbfdff;
    }

    .detalle-label {
      color:var(--texto-sec);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .detalle-valor {
      margin-top:4px;
      color:#1e293b;
      font-size:13px;
      font-weight:900;
      overflow-wrap:anywhere;
    }

    /* =====================================================
       CARGANDO
    ====================================================== */

    .cargando {
      display:none;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:18px;
      color:var(--azul);
      font-size:13px;
      font-weight:900;
    }

    .cargando.visible {
      display:flex;
    }

    .spinner {
      width:20px;
      height:20px;
      border:3px solid #dbeafe;
      border-top-color:var(--azul);
      border-radius:50%;
      animation:girar .8s linear infinite;
    }

    @keyframes girar {
      to {
        transform:rotate(360deg);
      }
    }

    .sin-registros {
      padding:28px 16px;
      border:1px dashed #cbd5e1;
      border-radius:15px;
      color:var(--texto-sec);
      background:#f8fafc;
      text-align:center;
      line-height:1.5;
      font-size:13px;
    }

    @media (max-width:800px) {

      .buscador-grid {
        grid-template-columns:1fr;
      }

      .boton {
        width:100%;
      }

      .resumen {
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

    }

    @media (max-width:650px) {

      .contenedor {
        width:calc(100% - 16px);
        margin:12px auto 35px;
      }

      .encabezado h1 {
        font-size:25px;
      }

      .encabezado p {
        font-size:12px;
      }

      .tarjeta {
        padding:16px;
        border-radius:18px;
        margin-bottom:13px;
      }

      .titulo-icono {
        width:39px;
        height:39px;
        flex-basis:39px;
        border-radius:11px;
        font-size:19px;
      }

      .titulo-seccion h2 {
        font-size:19px;
      }

      .titulo-seccion p {
        font-size:11px;
      }

      .rango {
        grid-template-columns:1fr;
      }

      .perfil-linea {
        flex-direction:column;
        gap:9px;
      }

      .perfil-codigo {
        align-self:flex-start;
      }

      .resumen {
        gap:8px;
      }

      .resumen-item {
        min-height:82px;
      }

      .resumen-numero {
        font-size:25px;
      }

      .historial-cabecera {
        align-items:flex-start;
        flex-direction:column;
      }

      .periodo {
        text-align:left;
      }

      .dia-cabecera {
        grid-template-columns:40px minmax(0,1fr) auto 28px;
        gap:7px;
        padding:10px;
      }

      .dia-icono {
        width:36px;
        height:36px;
      }

      .dia-fecha {
        font-size:13px;
      }

      .estado {
        padding:6px 8px;
        font-size:10px;
      }

      .flecha {
        width:28px;
        height:28px;
      }

      .detalle-grid {
        grid-template-columns:1fr;
      }

      .resultado-estudiante {
        grid-template-columns:36px minmax(0,1fr) auto;
        gap:8px;
        padding:11px;
      }

      .resultado-icono {
        width:36px;
        height:36px;
      }

      .resultado-nombre {
        font-size:13px;
      }

      .resultado-datos {
        font-size:11px;
      }

      .resultado-flecha {
        font-size:10px;
      }

      .perfil-nombre {
        font-size:18px;
      }

    }

    @media (max-width:380px) {

      .contenedor {
        width:calc(100% - 12px);
      }

      .dia-cabecera {
        grid-template-columns:36px minmax(0,1fr) auto 25px;
      }

      .estado {
        max-width:72px;
        overflow:hidden;
        text-overflow:ellipsis;
      }

    }

  </style>

</head>


<body>

  <!-- ===================================================
       MENÚ COMÚN CET 34
  ==================================================== -->

  <cet34-menu></cet34-menu>


  <!-- ===================================================
       CONTENIDO PRIVADO
  ==================================================== -->

  <div
    id="contenidoPrivado"
    class="contenido-privado"
  >

    <main class="contenedor">

      <header class="encabezado">

        <h1>
          🕘 Historial de asistencia
        </h1>

        <p>
          Consulta cronológica de los registros de asistencia
          de cada estudiante.
        </p>

      </header>


      <!-- =================================================
           BÚSQUEDA
      ================================================== -->

      <section class="tarjeta">

        <div class="titulo-seccion">

          <div class="titulo-icono">
            🔎
          </div>

          <div>

            <h2>
              Buscar estudiante
            </h2>

            <p>
              Busca por nombre, apellido o código
              y consulta su historial.
            </p>

          </div>

        </div>


        <div class="buscador-grid">

          <div class="campo">

            <label for="buscarEstudiante">
              Nombre, apellido o código
            </label>

            <input
              type="text"
              id="buscarEstudiante"
              placeholder="Ejemplo: Silva, Quispe o código..."
              autocomplete="off"
              onkeydown="manejarEnterBusqueda(event)"
            >

          </div>


          <button
            type="button"
            class="boton boton-vino"
            id="btnBuscar"
            onclick="buscarEstudiantes()"
          >
            🔎 Buscar
          </button>

        </div>


        <div class="rango">

          <div class="campo">

            <label for="fechaInicio">
              Fecha de inicio
            </label>

            <input
              type="date"
              id="fechaInicio"
            >

          </div>


          <div class="campo">

            <label for="fechaFin">
              Fecha de fin
            </label>

            <input
              type="date"
              id="fechaFin"
            >

          </div>

        </div>


        <div
          id="mensaje"
          class="mensaje"
        ></div>


        <div
          id="cargandoBusqueda"
          class="cargando"
        >
          <div class="spinner"></div>
          Buscando estudiantes...
        </div>


        <div
          id="resultados"
          class="resultados"
        ></div>


        <div
          id="estudianteSeleccionado"
          class="estudiante-seleccionado"
        >

          <div class="perfil-linea">

            <div>

              <div
                id="perfilNombre"
                class="perfil-nombre"
              ></div>

              <div
                id="perfilDatos"
                class="perfil-datos"
              ></div>

            </div>


            <div
              id="perfilCodigo"
              class="perfil-codigo"
            ></div>

          </div>

        </div>

      </section>


      <!-- =================================================
           HISTORIAL
      ================================================== -->

      <section
        id="historial"
        class="tarjeta historial"
      >

        <div class="historial-cabecera">

          <div>

            <h2>
              📅 Registro día por día
            </h2>

          </div>

          <div
            id="periodo"
            class="periodo"
          ></div>

        </div>


        <div
          id="resumen"
          class="resumen"
        ></div>


        <div
          id="listaHistorial"
        ></div>

      </section>

    </main>

  </div>


  <script>

    /* =====================================================
       VARIABLES
    ====================================================== */

    let estudianteSeleccionado = null;


    /* =====================================================
       UTILIDADES
    ====================================================== */

    function escaparHTML(texto) {

      if (
        texto === null ||
        texto === undefined
      ) {
        return "";
      }

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function hoyISO() {

      const fecha =
        new Date();

      const anio =
        fecha.getFullYear();

      const mes =
        String(
          fecha.getMonth() + 1
        ).padStart(2, "0");

      const dia =
        String(
          fecha.getDate()
        ).padStart(2, "0");

      return `${anio}-${mes}-${dia}`;

    }


    function mostrarMensaje(
      texto,
      tipo
    ) {

      const elemento =
        document.getElementById(
          "mensaje"
        );

      elemento.textContent =
        texto;

      elemento.className =
        "mensaje visible " +
        tipo;

    }


    function ocultarMensaje() {

      const elemento =
        document.getElementById(
          "mensaje"
        );

      elemento.textContent =
        "";

      elemento.className =
        "mensaje";

    }


    function validarFechas() {

      const inicio =
        document.getElementById(
          "fechaInicio"
        ).value;

      const fin =
        document.getElementById(
          "fechaFin"
        ).value;

      if (
        !inicio ||
        !fin
      ) {

        mostrarMensaje(
          "Selecciona la fecha de inicio y la fecha de fin.",
          "info"
        );

        return false;
      }

      if (
        inicio > fin
      ) {

        mostrarMensaje(
          "La fecha de inicio no puede ser posterior a la fecha de fin.",
          "error"
        );

        return false;
      }

      return true;

    }


    function formatoFecha(
      texto
    ) {

      if (!texto) {
        return "—";
      }

      const partes =
        String(texto)
          .split("/");

      if (
        partes.length === 3 &&
        partes[0].length <= 2
      ) {

        return `${partes[0].padStart(2,"0")}/${partes[1].padStart(2,"0")}/${partes[2]}`;

      }

      return String(texto);

    }


    function estadoClase(
      estado
    ) {

      const normalizado =
        String(
          estado || ""
        )
          .trim()
          .toLowerCase();

      if (
        normalizado ===
        "presente"
      ) {

        return "estado estado-presente";

      }

      if (
        normalizado ===
        "tardanza"
      ) {

        return "estado estado-tardanza";

      }

      if (
        normalizado ===
        "falta" ||
        normalizado ===
        "faltante"
      ) {

        return "estado estado-falta";

      }

      return "estado estado-pendiente";

    }


    function mostrarHora(
      hora
    ) {

      if (!hora) {
        return "Sin registro";
      }

      return String(
        hora
      );

    }


    /* =====================================================
       FECHAS INICIALES
    ====================================================== */

    function configurarFechas() {

      const hoy =
        hoyISO();

      document.getElementById(
        "fechaInicio"
      ).value = hoy;

      document.getElementById(
        "fechaFin"
      ).value = hoy;

    }


    /* =====================================================
       ENTER EN BÚSQUEDA
    ====================================================== */

    function manejarEnterBusqueda(
      evento
    ) {

      if (
        evento.key === "Enter"
      ) {

        buscarEstudiantes();

      }

    }


    /* =====================================================
       BUSCAR ESTUDIANTE
    ====================================================== */

    async function buscarEstudiantes() {

      const texto =
        document.getElementById(
          "buscarEstudiante"
        ).value.trim();


      if (
        texto.length < 2
      ) {

        mostrarMensaje(
          "Escribe al menos 2 caracteres para buscar.",
          "info"
        );

        return;

      }


      ocultarMensaje();


      const boton =
        document.getElementById(
          "btnBuscar"
        );

      const cargando =
        document.getElementById(
          "cargandoBusqueda"
        );

      const resultados =
        document.getElementById(
          "resultados"
        );


      boton.disabled =
        true;

      cargando.classList.add(
        "visible"
      );

      resultados.classList.remove(
        "visible"
      );

      resultados.innerHTML =
        "";


      try {

        const datos =
          await CET34Auth.request(
            "buscarestudiante",
            {
              q:
                texto
            }
          );


        if (
          !datos ||
          datos.exito !== true
        ) {

          throw new Error(
            datos &&
            datos.mensaje
              ? datos.mensaje
              : "No se pudo realizar la búsqueda."
          );

        }


        mostrarResultados(
          Array.isArray(
            datos.estudiantes
          )
            ? datos.estudiantes
            : []
        );

      }

      catch(error) {

        console.error(
          "CET34 HISTORIAL:",
          error
        );

        mostrarMensaje(
          "✕ " +
          (
            error.message ||
            "No se pudo realizar la búsqueda."
          ),
          "error"
        );

      }

      finally {

        boton.disabled =
          false;

        cargando.classList.remove(
          "visible"
        );

      }

    }


    /* =====================================================
       MOSTRAR RESULTADOS
    ====================================================== */

    function mostrarResultados(
      estudiantes
    ) {

      const contenedor =
        document.getElementById(
          "resultados"
        );

      contenedor.innerHTML =
        "";


      if (
        estudiantes.length === 0
      ) {

        contenedor.innerHTML = `

          <div class="sin-registros">

            🔎 No se encontraron
            estudiantes que coincidan
            con la búsqueda.

          </div>

        `;

        contenedor.classList.add(
          "visible"
        );

        return;

      }


      const titulo =
        document.createElement(
          "div"
        );

      titulo.className =
        "resultados-titulo";

      titulo.textContent =
        estudiantes.length === 1
          ? "1 estudiante encontrado"
          : `${estudiantes.length} estudiantes encontrados`;

      contenedor.appendChild(
        titulo
      );


      estudiantes.forEach(
        function(estudiante,index) {

          const boton =
            document.createElement(
              "button"
            );

          boton.type =
            "button";

          boton.className =
            "resultado-estudiante";


          boton.innerHTML = `

            <span class="resultado-icono">
              ${String(index + 1).padStart(2,"0")}
            </span>

            <span>

              <span
                class="resultado-nombre"
              >
                ${escaparHTML(
                  estudiante.estudiante
                )}
              </span>

              <span
                class="resultado-datos"
              >
                ${escaparHTML(
                  estudiante.grado || ""
                )}
                · Sección
                ${escaparHTML(
                  estudiante.seccion || ""
                )}
                · Código:
                ${escaparHTML(
                  estudiante.codigo || ""
                )}
              </span>

            </span>

            <span
              class="resultado-flecha"
            >
              Ver →
            </span>

          `;


          boton.addEventListener(
            "click",
            function() {

              seleccionarEstudiante(
                estudiante
              );

            }
          );


          contenedor.appendChild(
            boton
          );

        }
      );


      contenedor.classList.add(
        "visible"
      );

    }


    /* =====================================================
       SELECCIONAR
    ====================================================== */

    function seleccionarEstudiante(
      estudiante
    ) {

      if (
        !validarFechas()
      ) {
        return;
      }


      estudianteSeleccionado =
        estudiante;


      document.getElementById(
        "perfilNombre"
      ).textContent =
        estudiante.estudiante || "";


      document.getElementById(
        "perfilDatos"
      ).textContent =
        `${estudiante.grado || ""} · Sección ${estudiante.seccion || ""}`;


      document.getElementById(
        "perfilCodigo"
      ).textContent =
        "Código " +
        (
          estudiante.codigo || "—"
        );


      document.getElementById(
        "estudianteSeleccionado"
      ).classList.add(
        "visible"
      );


      obtenerHistorial(
        estudiante.codigo
      );

    }


    /* =====================================================
       OBTENER HISTORIAL
    ====================================================== */

    async function obtenerHistorial(
      codigo
    ) {

      if (
        !codigo
      ) {

        mostrarMensaje(
          "El estudiante seleccionado no tiene código.",
          "error"
        );

        return;

      }


      const inicio =
        document.getElementById(
          "fechaInicio"
        ).value;

      const fin =
        document.getElementById(
          "fechaFin"
        ).value;


      const historial =
        document.getElementById(
          "historial"
        );


      historial.classList.remove(
        "visible"
      );


      try {

        mostrarMensaje(
          "Consultando historial...",
          "info"
        );


        const datos =
          await CET34Auth.request(
            "reporteestudiante",
            {
              codigoEstudiante:
                codigo,

              fechaInicio:
                inicio,

              fechaFin:
                fin
            }
          );


        if (
          !datos ||
          datos.exito !== true
        ) {

          throw new Error(
            datos &&
            datos.mensaje
              ? datos.mensaje
              : "No se pudo obtener el historial."
          );

        }


        renderizarHistorial(
          datos
        );


        mostrarMensaje(
          "✓ Historial actualizado correctamente.",
          "exito"
        );


      }

      catch(error) {

        console.error(
          "CET34 HISTORIAL:",
          error
        );

        mostrarMensaje(
          "✕ " +
          (
            error.message ||
            "No se pudo obtener el historial."
          ),
          "error"
        );

      }

    }


    /* =====================================================
       RESUMEN
    ====================================================== */

    function renderizarResumen(
      datos
    ) {

      const resumen =
        document.getElementById(
          "resumen"
        );

      resumen.innerHTML = `

        <div class="resumen-item">
          <div class="resumen-numero verde">
            ${Number(
              datos.presentes || 0
            )}
          </div>
          <div class="resumen-etiqueta">
            🟢 Presentes
          </div>
        </div>

        <div class="resumen-item">
          <div class="resumen-numero amarillo">
            ${Number(
              datos.tardanzas || 0
            )}
          </div>
          <div class="resumen-etiqueta">
            🟡 Tardanzas
          </div>
        </div>

        <div class="resumen-item">
          <div class="resumen-numero azul">
            ${Number(
              datos.pendientes || 0
            )}
          </div>
          <div class="resumen-etiqueta">
            🔵 Pendientes
          </div>
        </div>

        <div class="resumen-item">
          <div class="resumen-numero rojo">
            ${Number(
              datos.faltas || 0
            )}
          </div>
          <div class="resumen-etiqueta">
            🔴 Faltas
          </div>
        </div>

      `;

    }


    /* =====================================================
       HISTORIAL DÍA POR DÍA
    ====================================================== */

    function renderizarHistorial(
      datos
    ) {

      const historial =
        document.getElementById(
          "historial"
        );

      const lista =
        document.getElementById(
          "listaHistorial"
        );

      const periodo =
        document.getElementById(
          "periodo"
        );


      periodo.textContent =
        `Periodo: ${escaparHTML(
          datos.fechaInicio || ""
        )} → ${escaparHTML(
          datos.fechaFin || ""
        )}`;


      renderizarResumen(
        datos
      );


      lista.innerHTML =
        "";


      const registros =
        Array.isArray(
          datos.historial
        )
          ? datos.historial
          : [];


      if (
        registros.length === 0
      ) {

        lista.innerHTML = `

          <div class="sin-registros">

            📅 No existen jornadas
            configuradas dentro del
            periodo seleccionado.

          </div>

        `;

        historial.classList.add(
          "visible"
        );

        return;

      }


      registros.forEach(
        function(registro,index) {

          const articulo =
            document.createElement(
              "div"
            );

          articulo.className =
            "dia";


          const estado =
            String(
              registro.estado || "Pendiente"
            );


          const estadoNormalizado =
            estado
              .toLowerCase()
              .trim();


          let icono =
            "📅";


          if (
            estadoNormalizado ===
            "presente"
          ) {

            icono =
              "🟢";

          }

          else if (
            estadoNormalizado ===
            "tardanza"
          ) {

            icono =
              "🟡";

          }

          else if (
            estadoNormalizado ===
            "falta" ||
            estadoNormalizado ===
            "faltante"
          ) {

            icono =
              "🔴";

          }

          else {

            icono =
              "🔵";

          }


          const horarioTexto =
            (
              registro.horaEntrada &&
              registro.horaSalida
            )
              ? `${registro.horaEntrada} → ${registro.horaSalida}`
              : (
                  registro.horaEntrada
                    ? `Entrada: ${registro.horaEntrada}`
                    : "Horario no disponible"
                );


          const horaReal =
            registro.hora
              ? registro.hora
              : "Sin registro";


          articulo.innerHTML = `

            <button
              type="button"
              class="dia-cabecera"
              aria-expanded="false"
            >

              <span class="dia-icono">
                ${icono}
              </span>

              <span>

                <span
                  class="dia-fecha"
                >
                  ${escaparHTML(
                    formatoFecha(
                      registro.fecha
                    )
                  )}
                </span>

                <span
                  class="dia-subtexto"
                >
                  ${escaparHTML(
                    registro.dia || ""
                  )}
                }
                </span>

              </span>

              <span
                class="${estadoClase(
                  estado
                )}"
              >
                ${escaparHTML(
                  estado
                )}
              </span>

              <span
                class="flecha"
                aria-hidden="true"
              >
                <span class="flecha-icono"></span>
              </span>

            </button>


            <div class="dia-detalle">

              <div class="detalle-grid">

                <div class="detalle-item">

                  <div class="detalle-label">
                    Registro
                  </div>

                  <div
                    class="detalle-valor"
                  >
                    🕐
                    ${escaparHTML(
                      horaReal
                    )}
                  </div>

                </div>


                <div class="detalle-item">

                  <div class="detalle-label">
                    Horario
                  </div>

                  <div
                    class="detalle-valor"
                  >
                    ⏰
                    ${escaparHTML(
                      horarioTexto
                    )}
                  </div>

                </div>


                <div class="detalle-item">

                  <div class="detalle-label">
                    Estado
                  </div>

                  <div
                    class="detalle-valor"
                  >
                    ${icono}
                    ${escaparHTML(
                      estado
                    )}
                  </div>

                </div>


                <div class="detalle-item">

                  <div class="detalle-label">
                    Jornada
                  </div>

                  <div
                    class="detalle-valor"
                  >
                    ${index + 1}
                    de
                    ${registros.length}
                  </div>

                </div>

              </div>

            </div>

          `;


          const boton =
            articulo.querySelector(
              ".dia-cabecera"
            );


          boton.addEventListener(
            "click",
            function() {

              const abierto =
                articulo.classList.toggle(
                  "abierto"
                );

              boton.setAttribute(
                "aria-expanded",
                abierto
                  ? "true"
                  : "false"
              );

            }
          );


          lista.appendChild(
            articulo
          );

        }
      );


      historial.classList.add(
        "visible"
      );


      setTimeout(
        function() {

          historial.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });

        },
        80
      );

    }


    /* =====================================================
       CUANDO CAMBIAN LAS FECHAS
    ====================================================== */

    document
      .getElementById("fechaInicio")
      .addEventListener(
        "change",
        function() {

          if (
            estudianteSeleccionado &&
            validarFechas()
          ) {

            obtenerHistorial(
              estudianteSeleccionado.codigo
            );

          }

        }
      );


    document
      .getElementById("fechaFin")
      .addEventListener(
        "change",
        function() {

          if (
            estudianteSeleccionado &&
            validarFechas()
          ) {

            obtenerHistorial(
              estudianteSeleccionado.codigo
            );

          }

        }
      );


    /* =====================================================
       AUTENTICACIÓN
    ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        configurarFechas();


        if (
          !window.CET34Auth
        ) {

          console.error(
            "CET34 HISTORIAL: auth.js no está disponible."
          );

          return;

        }


        try {

          const usuario =
            await CET34Auth.requireAuth({
              roles:[
                "ADMINISTRADOR",
                "DOCENTE"
              ],
              mensaje:
                "Verificando tu cuenta de Google..."
            });


          console.info(
            "CET34 HISTORIAL: usuario autorizado:",
            usuario.rol
          );


          document
            .getElementById(
              "contenidoPrivado"
            )
            .classList.add(
              "autorizado"
            );


        }

        catch(error) {

          console.warn(
            "CET34 HISTORIAL: acceso no completado.",
            error
          );

        }

      }
    );

  </script>

</body>

</html>
