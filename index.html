<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CET 34 - Control de Asistencia</title>


  <!-- =========================================
       LIBRERÍA PARA ESCANEAR CÓDIGOS QR
       ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =========================================
       CONFIGURACIÓN GENERAL
       ========================================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;

      color: #0f172a;

    }


    /* =========================================
       ENCABEZADO
       ========================================= */

    .header {

      background: #0f172a;

      color: white;

      padding: 20px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 26px;

    }


    .header p {

      margin: 6px 0 0;

      font-size: 14px;

      opacity: 0.85;

    }


    /* =========================================
       CONTENEDOR
       ========================================= */

    .container {

      width: 100%;

      max-width: 600px;

      margin: auto;

      padding: 15px;

    }


    /* =========================================
       TARJETAS
       ========================================= */

    .card {

      background: white;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 15px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

    }


    /* =========================================
       INSTRUCCIÓN
       ========================================= */

    .instruction {

      text-align: center;

      font-size: 15px;

      color: #475569;

      margin-bottom: 15px;

    }


    /* =========================================
       ESCÁNER
       ========================================= */

    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

      overflow: hidden;

      border-radius: 15px;

    }


    #reader video {

      width: 100%;

      border-radius: 15px;

    }


    /* =========================================
       RESULTADO
       ========================================= */

    #resultado {

      display: none;

      text-align: center;

      margin-top: 15px;

      padding: 20px;

      border-radius: 15px;

    }


    .success {

      display: block !important;

      background: #dcfce7;

      color: #166534;

    }


    .warning {

      display: block !important;

      background: #fef3c7;

      color: #92400e;

    }


    .error {

      display: block !important;

      background: #fee2e2;

      color: #991b1b;

    }


    /* =========================================
       NOMBRE DEL ESTUDIANTE
       ========================================= */

    .student {

      font-size: 21px;

      font-weight: bold;

      margin-top: 8px;

    }


    /* =========================================
       HORA
       ========================================= */

    .time {

      font-size: 30px;

      font-weight: bold;

      margin-top: 10px;

    }


    /* =========================================
       ESTADÍSTICAS
       ========================================= */

    .stats {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

    }


    .stat {

      background: #f8fafc;

      border-radius: 12px;

      padding: 15px;

      text-align: center;

    }


    .number {

      font-size: 28px;

      font-weight: bold;

    }


    .label {

      font-size: 13px;

      color: #64748b;

      margin-top: 5px;

    }


    /* =========================================
       PIE DE PÁGINA
       ========================================= */

    .footer {

      text-align: center;

      color: #94a3b8;

      font-size: 12px;

      padding: 10px;

    }


  </style>

</head>


<body>


  <!-- =========================================
       ENCABEZADO
       ========================================= -->

  <div class="header">

    <h1>🏫 CET 34</h1>

    <p>CONTROL DE ASISTENCIA QR</p>

  </div>


  <div class="container">


    <!-- =======================================
         ESCÁNER
         ======================================= -->

    <div class="card">

      <div class="instruction">

        📷 Coloca el código QR del estudiante
        frente a la cámara

      </div>


      <div id="reader"></div>


      <!-- RESULTADO -->

      <div id="resultado"></div>

    </div>


    <!-- =======================================
         ESTADÍSTICAS
         ======================================= -->

    <div class="card">

      <div class="stats">


        <!-- PRESENTES -->

        <div class="stat">

          <div
            id="presentes"
            class="number">

            0

          </div>

          <div class="label">

            🟢 Presentes

          </div>

        </div>


        <!-- TARDANZAS -->

        <div class="stat">

          <div
            id="tardanzas"
            class="number">

            0

          </div>

          <div class="label">

            🟡 Tardanzas

          </div>

        </div>


      </div>

    </div>


    <div class="footer">

      CET 34 · Sistema de Asistencia Digital

    </div>


  </div>



<script>


  /* =========================================
     CONFIGURACIÓN
     ========================================= */

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbz4GruqdN5Fs57l3C_HQC0GF3tfqXmiGGqrTHuwkrntNgCKbCIbV0KdedUpqWZ84A0R/exec";


  /* =========================================
     VARIABLES
     ========================================= */

  let scanner = null;

  let procesando = false;

  let totalPresentes = 0;

  let totalTardanzas = 0;



  /* =========================================
     DETECTAR QR
     ========================================= */

  function qrDetectado(codigo) {


    // Evitar lecturas múltiples
    // mientras estamos procesando

    if (procesando) {

      return;

    }


    procesando = true;


    console.log(
      "QR detectado:",
      codigo
    );


    // Detener temporalmente
    // la cámara

    scanner.stop()

      .then(function() {


        registrarAsistencia(
          codigo
        );


      })

      .catch(function(error) {


        console.error(
          "Error al detener escáner:",
          error
        );


        registrarAsistencia(
          codigo
        );

      });

  }



  /* =========================================
     ENVIAR ASISTENCIA A APPS SCRIPT
     ========================================= */

  function registrarAsistencia(
    codigo
  ) {


    mostrarProcesando();


    const url =

      URL_APPS_SCRIPT +

      "?codigo=" +

      encodeURIComponent(
        codigo
      );


    console.log(
      "Enviando:",
      url
    );


    fetch(url)


      .then(function(response) {


        if (!response.ok) {

          throw new Error(
            "Error HTTP: " +
            response.status
          );

        }


        return response.json();

      })


      .then(function(data) {


        console.log(
          "Respuesta:",
          data
        );


        procesarRespuesta(
          data
        );

      })


      .catch(function(error) {


        console.error(
          "Error de conexión:",
          error
        );


        mostrarError(
          "No se pudo conectar con el servidor."
        );


        setTimeout(
          function() {

            iniciarScanner();

          },

          2500

        );

      });

  }



  /* =========================================
     PROCESAR RESPUESTA
     ========================================= */

  function procesarRespuesta(
    data
  ) {


    procesando = false;


    /* -----------------------------------------
       ASISTENCIA REGISTRADA
       ----------------------------------------- */

    if (

      data.exito === true &&

      data.tipo === "registrado"

    ) {


      if (
        data.estado === "Presente"
      ) {

        totalPresentes++;

        document.getElementById(
          "presentes"
        ).textContent =
          totalPresentes;

      }


      if (
        data.estado === "Tardanza"
      ) {

        totalTardanzas++;

        document.getElementById(
          "tardanzas"
        ).textContent =
          totalTardanzas;

      }


      mostrarAsistencia(
        data
      );


      // Volver automáticamente
      // al escáner

      setTimeout(
        function() {

          iniciarScanner();

        },

        2500

      );


      return;

    }



    /* -----------------------------------------
       DUPLICADO
       ----------------------------------------- */

    if (

      data.exito === false &&

      data.tipo === "duplicado"

    ) {


      mostrarDuplicado(
        data
      );


      setTimeout(
        function() {

          iniciarScanner();

        },

        2500

      );


      return;

    }



    /* -----------------------------------------
       SIN HORARIO
       ----------------------------------------- */

    if (

      data.estado === "Sin horario"

    ) {


      mostrarSinHorario(
        data
      );


      setTimeout(
        function() {

          iniciarScanner();

        },

        2500

      );


      return;

    }



    /* -----------------------------------------
       ERROR
       ----------------------------------------- */

    mostrarError(

      data.mensaje ||

      "No se pudo registrar la asistencia."

    );


    setTimeout(
      function() {

        iniciarScanner();

      },

      2500

    );

  }



  /* =========================================
     MENSAJE: PROCESANDO
     ========================================= */

  function mostrarProcesando() {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "warning";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:40px;
      ">

        ⏳

      </div>


      <div class="student">

        REGISTRANDO...

      </div>


      <div>

        Guardando asistencia

      </div>

    `;

  }



  /* =========================================
     MENSAJE: ASISTENCIA
     ========================================= */

  function mostrarAsistencia(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "success";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        🟢

      </div>


      <div class="student">

        ASISTENCIA REGISTRADA

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante}

      </div>


      <div style="
        margin-top:8px;
      ">

        ${data.grado}

        ·

        Sección ${data.seccion}

      </div>


      <div class="time">

        ${data.hora}

      </div>


      <div style="
        font-weight:bold;
        margin-top:5px;
      ">

        🟢 ${data.estado}

      </div>

    `;

  }



  /* =========================================
     MENSAJE: DUPLICADO
     ========================================= */

  function mostrarDuplicado(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "warning";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ⚠️

      </div>


      <div class="student">

        YA REGISTRADO

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante}

      </div>


      <div style="
        margin-top:10px;
      ">

        La asistencia ya fue registrada.

      </div>


      <div class="time">

        ${data.horaRegistro}

      </div>

    `;

  }



  /* =========================================
     MENSAJE: SIN HORARIO
     ========================================= */

  function mostrarSinHorario(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "error";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ⚠️

      </div>


      <div class="student">

        SIN HORARIO

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante || ""}

      </div>


      <div style="
        margin-top:8px;
      ">

        Este estudiante no tiene
        horario configurado para hoy.

      </div>

    `;

  }



  /* =========================================
     MENSAJE: ERROR
     ========================================= */

  function mostrarError(
    mensaje
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "error";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ❌

      </div>


      <div class="student">

        ERROR

      </div>


      <div style="
        margin-top:10px;
      ">

        ${mensaje}

      </div>

    `;

  }



  /* =========================================
     INICIAR ESCÁNER
     ========================================= */

  function iniciarScanner() {


    procesando = false;


    const reader =
      document.getElementById(
        "reader"
      );


    // Limpiar escáner anterior

    reader.innerHTML = "";


    // Ocultar resultado

    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.style.display =
      "none";


    // Crear nuevo escáner

    scanner =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {


      fps: 10,


      qrbox:
        function(
          width,
          height
        ) {


          const size =
            Math.min(
              width,
              height
            ) * 0.70;


          return {

            width: size,

            height: size

          };

        }

    };


    // Iniciar cámara trasera

    scanner.start(

      {
        facingMode:
          "environment"
      },


      configuracion,


      qrDetectado,


      function(errorMessage) {

        // Errores normales de lectura.
        // No mostramos nada.

      }

    )


    .catch(function(error) {


      console.error(
        "Error de cámara:",
        error
      );


      mostrarError(
        "No se pudo acceder a la cámara."
      );

    });

  }



  /* =========================================
     INICIAR AL CARGAR LA PÁGINA
     ========================================= */

  window.addEventListener(
    "load",
    function() {

      iniciarScanner();

    }
  );


</script>


</body>

</html>
