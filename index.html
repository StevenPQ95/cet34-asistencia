<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>CET 34 - Asistencia QR</title>


  <!-- =========================================
       LIBRERÍA QR
       ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =========================================
       GENERAL
       ========================================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f1f5f9;

      color:
        #0f172a;

    }


    /* =========================================
       ENCABEZADO
       ========================================= */

    .header {

      background:
        #0f172a;

      color:
        white;

      padding:
        20px 15px;

      text-align:
        center;

    }


    .header h1 {

      margin:
        0;

      font-size:
        25px;

    }


    .header p {

      margin:
        6px 0 0;

      font-size:
        13px;

      opacity:
        0.85;

    }


    /* =========================================
       CONTENEDOR
       ========================================= */

    .container {

      width:
        100%;

      max-width:
        650px;

      margin:
        auto;

      padding:
        15px;

    }


    /* =========================================
       TARJETAS
       ========================================= */

    .card {

      background:
        white;

      border-radius:
        18px;

      padding:
        18px;

      margin-bottom:
        15px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);

    }


    /* =========================================
       FECHA
       ========================================= */

    .fecha {

      text-align:
        center;

      font-size:
        14px;

      color:
        #64748b;

      margin-bottom:
        15px;

    }


    /* =========================================
       ESTADÍSTICAS GENERALES
       ========================================= */

    .titulo-estadisticas {

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        bold;

      margin-bottom:
        15px;

    }


    .estadisticas {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        8px;

    }


    .estadistica {

      text-align:
        center;

      padding:
        12px 5px;

      border-radius:
        12px;

      background:
        #f8fafc;

    }


    .numero {

      font-size:
        26px;

      font-weight:
        bold;

    }


    .etiqueta {

      font-size:
        11px;

      color:
        #64748b;

      margin-top:
        3px;

    }


    /* =========================================
       TOTAL GENERAL
       ========================================= */

    .total-general {

      text-align:
        center;

      margin-top:
        15px;

      padding:
        12px;

      border-radius:
        12px;

      background:
        #f8fafc;

    }


    .total-general strong {

      font-size:
        25px;

    }


    /* =========================================
       BARRA DE PROGRESO
       ========================================= */

    .barra-contenedor {

      margin-top:
        15px;

    }


    .barra-fondo {

      width:
        100%;

      height:
        12px;

      background:
        #e2e8f0;

      border-radius:
        20px;

      overflow:
        hidden;

    }


    .barra {

      height:
        100%;

      width:
        0%;

      background:
        #16a34a;

      transition:
        width 0.4s ease;

    }


    .porcentaje {

      text-align:
        center;

      font-size:
        14px;

      font-weight:
        bold;

      margin-top:
        7px;

    }


    /* =========================================
       GRUPOS
       ========================================= */

    .grupo {

      border:
        1px solid #e2e8f0;

      border-radius:
        15px;

      padding:
        15px;

      margin-bottom:
        12px;

    }


    .grupo-titulo {

      font-size:
        20px;

      font-weight:
        bold;

    }


    .grupo-hora {

      color:
        #64748b;

      font-size:
        13px;

      margin-top:
        3px;

      margin-bottom:
        12px;

    }


    .grupo-estadisticas {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        7px;

    }


    .grupo-estado {

      text-align:
        center;

      padding:
        10px 4px;

      border-radius:
        10px;

      background:
        #f8fafc;

    }


    .grupo-estado .numero {

      font-size:
        22px;

    }


    /* =========================================
       ESCÁNER
       ========================================= */

    .scanner-titulo {

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        bold;

      margin-bottom:
        5px;

    }


    .scanner-instruccion {

      text-align:
        center;

      color:
        #64748b;

      font-size:
        13px;

      margin-bottom:
        15px;

    }


    #reader {

      width:
        100%;

      max-width:
        500px;

      margin:
        auto;

      overflow:
        hidden;

      border-radius:
        15px;

    }


    #reader video {

      width:
        100%;

      border-radius:
        15px;

    }


    /* =========================================
       RESULTADO
       ========================================= */

    #resultado {

      display:
        none;

      text-align:
        center;

      margin-top:
        15px;

      padding:
        20px;

      border-radius:
        15px;

    }


    .success {

      display:
        block !important;

      background:
        #dcfce7;

      color:
        #166534;

    }


    .warning {

      display:
        block !important;

      background:
        #fef3c7;

      color:
        #92400e;

    }


    .error {

      display:
        block !important;

      background:
        #fee2e2;

      color:
        #991b1b;

    }


    .student {

      font-size:
        20px;

      font-weight:
        bold;

      margin-top:
        8px;

    }


    .hora {

      font-size:
        30px;

      font-weight:
        bold;

      margin-top:
        10px;

    }


    /* =========================================
       PIE
       ========================================= */

    .footer {

      text-align:
        center;

      color:
        #94a3b8;

      font-size:
        11px;

      padding:
        10px;

    }


    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (
      max-width: 400px
    ) {

      .estadisticas {

        gap:
          5px;

      }


      .numero {

        font-size:
          22px;

      }


      .grupo-estadisticas {

        gap:
          5px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       ENCABEZADO
       ========================================= -->

  <div class="header">

    <h1>
      🏫 CET 34
    </h1>

    <p>
      CONTROL DE ASISTENCIA QR
    </p>

  </div>


  <div class="container">


    <!-- =======================================
         FECHA
         ======================================= -->

    <div class="card">

      <div
        id="fecha"
        class="fecha">

        Cargando fecha...

      </div>


      <div class="titulo-estadisticas">

        📊 RESUMEN DEL DÍA

      </div>


      <!-- ESTADÍSTICAS GENERALES -->

      <div class="estadisticas">


        <div class="estadistica">

          <div
            id="presentesGeneral"
            class="numero">

            0

          </div>

          <div class="etiqueta">

            🟢 Presentes

          </div>

        </div>


        <div class="estadistica">

          <div
            id="tardanzasGeneral"
            class="numero">

            0

          </div>

          <div class="etiqueta">

            🟡 Tardanzas

          </div>

        </div>


        <div class="estadistica">

          <div
            id="faltantesGeneral"
            class="numero">

            0

          </div>

          <div class="etiqueta">

            🔴 Faltan

          </div>

        </div>

      </div>


      <!-- TOTAL -->

      <div class="total-general">

        👥 Total de estudiantes

        <br>

        <strong id="totalGeneral">

          0

        </strong>

      </div>


      <!-- BARRA -->

      <div class="barra-contenedor">

        <div class="barra-fondo">

          <div
            id="barraGeneral"
            class="barra">
          </div>

        </div>


        <div
          id="porcentajeGeneral"
          class="porcentaje">

          Asistencia: 0%

        </div>

      </div>

    </div>



    <!-- =======================================
         GRUPOS
         ======================================= -->

    <div class="card">

      <div class="titulo-estadisticas">

        🎓 GRUPOS DE HOY

      </div>


      <div id="grupos">

        <div
          style="
            text-align:center;
            color:#64748b;
          ">

          Cargando grupos...

        </div>

      </div>

    </div>



    <!-- =======================================
         ESCÁNER
         ======================================= -->

    <div class="card">

      <div class="scanner-titulo">

        📷 ESCANEAR QR

      </div>


      <div class="scanner-instruccion">

        Coloca el código QR frente a la cámara

      </div>


      <div id="reader"></div>


      <!-- RESULTADO -->

      <div id="resultado"></div>

    </div>


    <!-- =======================================
         PIE
         ======================================= -->

    <div class="footer">

      CET 34 · Sistema de Asistencia Digital

    </div>


  </div>



<script>


  /* =========================================
     CONFIGURACIÓN
     ========================================= */

  const URL_APPS_SCRIPT =

    "https://script.google.com/macros/s/AKfycbz4GruqdN5Fs57l3C_HQC0GF3tfqXmiGGqrTHuwkrntNgCKbCIbV0KdedUpqWZ84A0R/exec";


  /* =========================================
     VARIABLES
     ========================================= */

  let scanner = null;

  let procesando = false;



  /* =========================================
     CARGAR ESTADÍSTICAS
     ========================================= */

  function cargarEstadisticas() {


    const url =

      URL_APPS_SCRIPT +

      "?action=estadisticas";


    fetch(url)


      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Error HTTP: " +
            response.status
          );

        }


        return response.json();

      })


      .then(function(data) {

        console.log(
          "Estadísticas:",
          data
        );


        if (
          data.exito !== true
        ) {

          throw new Error(
            data.mensaje ||
            "No se pudieron obtener las estadísticas."
          );

        }


        mostrarEstadisticas(
          data
        );

      })


      .catch(function(error) {

        console.error(
          "Error estadísticas:",
          error
        );


        document.getElementById(
          "grupos"
        ).innerHTML = `

          <div style="
            text-align:center;
            color:#991b1b;
          ">

            ⚠️ No se pudieron cargar
            las estadísticas.

          </div>

        `;

      });

  }



  /* =========================================
     MOSTRAR ESTADÍSTICAS
     ========================================= */

  function mostrarEstadisticas(
    data
  ) {


    // ========================================
    // FECHA
    // ========================================

    document.getElementById(
      "fecha"
    ).textContent =

      data.dia +
      " · " +
      data.fecha;



    // ========================================
    // ESTADÍSTICAS GENERALES
    // ========================================

    document.getElementById(
      "presentesGeneral"
    ).textContent =

      data.presentesGeneral;


    document.getElementById(
      "tardanzasGeneral"
    ).textContent =

      data.tardanzasGeneral;


    document.getElementById(
      "faltantesGeneral"
    ).textContent =

      data.faltantesGeneral;


    document.getElementById(
      "totalGeneral"
    ).textContent =

      data.totalGeneral;


    document.getElementById(
      "porcentajeGeneral"
    ).textContent =

      "Asistencia: " +
      data.porcentajeGeneral +
      "%";


    document.getElementById(
      "barraGeneral"
    ).style.width =

      data.porcentajeGeneral +
      "%";



    // ========================================
    // GRUPOS
    // ========================================

    const contenedor =
      document.getElementById(
        "grupos"
      );


    contenedor.innerHTML = "";


    if (
      !data.grupos ||
      data.grupos.length === 0
    ) {

      contenedor.innerHTML = `

        <div style="
          text-align:center;
          color:#64748b;
          padding:15px;
        ">

          📅 Hoy no hay grupos
          configurados.

        </div>

      `;

      return;

    }


    data.grupos.forEach(
      function(grupo) {


        const tarjeta =
          document.createElement(
            "div"
          );


        tarjeta.className =
          "grupo";


        tarjeta.innerHTML = `

          <div class="grupo-titulo">

            🎓 ${grupo.grado}
            · Sección ${grupo.seccion}

          </div>


          <div class="grupo-hora">

            🕐 Entrada:
            ${grupo.hora}

          </div>


          <div class="grupo-estadisticas">


            <div class="grupo-estado">

              <div class="numero">

                ${grupo.presentes}

              </div>

              <div class="etiqueta">

                🟢 Presentes

              </div>

            </div>


            <div class="grupo-estado">

              <div class="numero">

                ${grupo.tardanzas}

              </div>

              <div class="etiqueta">

                🟡 Tardanzas

              </div>

            </div>


            <div class="grupo-estado">

              <div class="numero">

                ${grupo.faltantes}

              </div>

              <div class="etiqueta">

                🔴 Faltan

              </div>

            </div>

          </div>


          <div style="
            text-align:center;
            margin-top:12px;
            font-size:14px;
          ">

            👥 Total:
            <strong>
              ${grupo.total}
            </strong>

            ·

            📊
            <strong>
              ${grupo.porcentaje}%
            </strong>

          </div>


          <div class="barra-contenedor">

            <div class="barra-fondo">

              <div
                class="barra"
                style="
                  width:
                  ${grupo.porcentaje}%;
                ">

              </div>

            </div>

          </div>

        `;


        contenedor.appendChild(
          tarjeta
        );

      }
    );

  }



  /* =========================================
     DETECTAR QR
     ========================================= */

  function qrDetectado(
    codigo
  ) {


    if (
      procesando
    ) {

      return;

    }


    procesando =
      true;


    console.log(
      "QR detectado:",
      codigo
    );


    scanner.stop()

      .then(function() {

        registrarAsistencia(
          codigo
        );

      })

      .catch(function(error) {

        console.error(
          "Error al detener escáner:",
          error
        );


        registrarAsistencia(
          codigo
        );

      });

  }



  /* =========================================
     REGISTRAR ASISTENCIA
     ========================================= */

  function registrarAsistencia(
    codigo
  ) {


    mostrarProcesando();


    const url =

      URL_APPS_SCRIPT +

      "?codigo=" +

      encodeURIComponent(
        codigo
      );


    fetch(url)


      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Error HTTP: " +
            response.status
          );

        }


        return response.json();

      })


      .then(function(data) {

        console.log(
          "Respuesta:",
          data
        );


        procesarRespuesta(
          data
        );

      })


      .catch(function(error) {

        console.error(
          "Error de conexión:",
          error
        );


        mostrarError(
          "No se pudo conectar con el servidor."
        );


        setTimeout(
          function() {

            iniciarScanner();

          },
          2500
        );

      });

  }



  /* =========================================
     PROCESAR RESPUESTA
     ========================================= */

  function procesarRespuesta(
    data
  ) {


    procesando =
      false;


    // ========================================
    // REGISTRADO
    // ========================================

    if (

      data.exito === true &&

      data.tipo === "registrado"

    ) {


      mostrarAsistencia(
        data
      );


      // Actualizar estadísticas

      setTimeout(
        function() {

          cargarEstadisticas();

        },
        300
      );


      // Volver al escáner

      setTimeout(
        function() {

          iniciarScanner();

        },
        2500
      );


      return;

    }



    // ========================================
    // DUPLICADO
    // ========================================

    if (

      data.exito === false &&

      data.tipo === "duplicado"

    ) {


      mostrarDuplicado(
        data
      );


      setTimeout(
        function() {

          iniciarScanner();

        },
        2500
      );


      return;

    }



    // ========================================
    // SIN HORARIO
    // ========================================

    if (

      data.tipo === "sin_horario" ||

      data.estado === "Sin horario"

    ) {


      mostrarSinHorario(
        data
      );


      setTimeout(
        function() {

          iniciarScanner();

        },
        2500
      );


      return;

    }



    // ========================================
    // ERROR
    // ========================================

    mostrarError(

      data.mensaje ||

      "No se pudo registrar la asistencia."

    );


    setTimeout(
      function() {

        iniciarScanner();

      },
      2500
    );

  }



  /* =========================================
     PROCESANDO
     ========================================= */

  function mostrarProcesando() {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "warning";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:40px;
      ">

        ⏳

      </div>


      <div class="student">

        REGISTRANDO...

      </div>


      <div>

        Guardando asistencia...

      </div>

    `;

  }



  /* =========================================
     ASISTENCIA REGISTRADA
     ========================================= */

  function mostrarAsistencia(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "success";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        🟢

      </div>


      <div class="student">

        ASISTENCIA REGISTRADA

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante}

      </div>


      <div style="
        margin-top:8px;
      ">

        ${data.grado}
        ·
        Sección ${data.seccion}

      </div>


      <div class="hora">

        ${data.hora}

      </div>


      <div style="
        font-weight:bold;
        margin-top:5px;
      ">

        🟢 ${data.estado}

      </div>

    `;

  }



  /* =========================================
     DUPLICADO
     ========================================= */

  function mostrarDuplicado(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "warning";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ⚠️

      </div>


      <div class="student">

        YA REGISTRADO

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante}

      </div>


      <div style="
        margin-top:10px;
      ">

        La asistencia ya fue registrada.

      </div>


      <div class="hora">

        ${data.horaRegistro}

      </div>

    `;

  }



  /* =========================================
     SIN HORARIO
     ========================================= */

  function mostrarSinHorario(
    data
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "error";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ⚠️

      </div>


      <div class="student">

        SIN HORARIO

      </div>


      <div style="
        font-size:20px;
        font-weight:bold;
        margin-top:10px;
      ">

        ${data.estudiante || ""}

      </div>


      <div style="
        margin-top:8px;
      ">

        Este estudiante no tiene
        horario configurado para hoy.

      </div>

    `;

  }



  /* =========================================
     ERROR
     ========================================= */

  function mostrarError(
    mensaje
  ) {


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      "error";


    resultado.style.display =
      "block";


    resultado.innerHTML = `

      <div style="
        font-size:45px;
      ">

        ❌

      </div>


      <div class="student">

        ERROR

      </div>


      <div style="
        margin-top:10px;
      ">

        ${mensaje}

      </div>

    `;

  }



  /* =========================================
     INICIAR ESCÁNER
     ========================================= */

  function iniciarScanner() {


    procesando =
      false;


    const reader =
      document.getElementById(
        "reader"
      );


    reader.innerHTML =
      "";


    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.style.display =
      "none";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const configuracion = {

      fps:
        10,


      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;


          return {

            width:
              size,

            height:
              size

          };

        }

    };


    scanner.start(

      {
        facingMode:
          "environment"
      },


      configuracion,


      qrDetectado,


      function(
        errorMessage
      ) {

        // Errores normales de lectura.
        // No mostramos nada.

      }

    )


    .catch(function(error) {


      console.error(
        "Error de cámara:",
        error
      );


      mostrarError(
        "No se pudo acceder a la cámara."
      );

    });

  }



  /* =========================================
     INICIO
     ========================================= */

  window.addEventListener(
    "load",
    function() {


      // Cargar estadísticas

      cargarEstadisticas();


      // Iniciar cámara

      iniciarScanner();

    }
  );


</script>


</body>

</html>
