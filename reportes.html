<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CET 34 - Reportes de Asistencia</title>

<style>
:root{
  --vino:#7b2038;
  --vino-oscuro:#64172d;
  --azul:#2563eb;
  --verde:#16a34a;
  --amarillo:#d97706;
  --rojo:#dc2626;
  --pendiente:#2563eb;
  --fondo:#f3f6fa;
  --texto:#12213f;
  --muted:#61718d;
  --borde:#d9e2ee;
  --panel:#ffffff;
  --suave:#f7f9fc;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  width:min(1280px,calc(100% - 28px));
  margin:22px auto 45px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--borde);
  border-radius:24px;
  box-shadow:0 10px 30px rgba(25,45,75,.07);
}

.filters{
  padding:28px 30px;
}

.title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 24px;
  font-size:30px;
  font-weight:800;
}

.title span{font-size:28px}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:16px;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:15px;
  font-weight:700;
}

.field input,
.field select{
  width:100%;
  height:54px;
  border:1px solid #cbd7e7;
  border-radius:14px;
  background:white;
  padding:0 16px;
  color:var(--texto);
  font-size:16px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--vino);
  box-shadow:0 0 0 3px rgba(123,32,56,.10);
}

.actions{
  display:flex;
  justify-content:flex-end;
  margin-top:22px;
}

button{
  border:0;
  border-radius:14px;
  background:var(--vino);
  color:white;
  padding:15px 24px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  background:var(--vino-oscuro);
  transform:translateY(-1px);
}

button:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

.message{
  margin-top:20px;
  padding:16px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  display:none;
}

.message.ok{
  display:block;
  background:#ecfdf3;
  color:var(--verde);
}

.message.error{
  display:block;
  background:#fef2f2;
  color:var(--rojo);
}

.report{
  margin-top:22px;
  padding:28px 30px;
}

.report-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:24px;
}

.report-head h2{
  margin:0 0 6px;
  font-size:27px;
}

.period{
  margin:0;
  color:var(--muted);
  font-size:16px;
}

.percent{
  min-width:82px;
  padding:13px 16px;
  border-radius:16px;
  background:#eef5ff;
  color:var(--azul);
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.stat{
  min-height:105px;
  padding:18px 12px;
  border:1px solid #e5ebf3;
  border-radius:18px;
  background:var(--suave);
  text-align:center;
}

.stat .number{
  font-size:31px;
  font-weight:900;
  line-height:1.1;
}

.stat .label{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}

.dot{
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
}

.green{color:var(--verde)}
.green .dot{background:#4ade80}

.yellow{color:var(--amarillo)}
.yellow .dot{background:#fbbf24}

.red{color:var(--rojo)}
.red .dot{background:#f43f5e}

.blue{color:var(--pendiente)}
.blue .dot{background:#3b82f6}

.total .number{color:#6d172f}

.progress{
  height:14px;
  margin:24px 0 28px;
  border-radius:999px;
  background:#e1e8f1;
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,#16a34a,#22c55e);
  border-radius:inherit;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 16px;
  font-size:25px;
}

.section-title span{font-size:23px}

.students{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.student{
  border:1px solid var(--borde);
  border-radius:18px;
  overflow:hidden;
  background:#fff;
}

.student-head{
  display:grid;
  grid-template-columns:55px minmax(0,1fr) auto 30px;
  align-items:center;
  gap:12px;
  padding:16px 18px;
  cursor:pointer;
  user-select:none;
}

.student-head:hover{
  background:#fafbfd;
}

.student-number{
  color:#91a2bb;
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.student-name{
  min-width:0;
  font-size:17px;
  font-weight:800;
}

.student-summary{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  flex-wrap:wrap;
}

.mini{
  padding:6px 9px;
  border-radius:999px;
  background:#f4f7fb;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.mini.present{color:var(--verde);background:#ecfdf3}
.mini.late{color:var(--amarillo);background:#fffbeb}
.mini.absent{color:var(--rojo);background:#fff1f2}
.mini.pending{color:var(--pendiente);background:#eff6ff}

.chevron{
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#8ca0bb;
  font-size:19px;
  font-weight:900;
  transition:transform .2s ease;
}

.student.open .chevron{
  transform:rotate(180deg);
}

.student-body{
  display:none;
  padding:0 18px 18px;
  border-top:1px solid #edf1f6;
  background:#fbfcfe;
}

.student.open .student-body{
  display:block;
}

.student-overview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:15px 0;
}

.overview-item{
  padding:10px;
  border-radius:12px;
  background:white;
  border:1px solid #e7edf5;
  text-align:center;
}

.overview-item strong{
  display:block;
  font-size:18px;
}

.overview-item small{
  color:var(--muted);
  font-size:12px;
}

.days{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.day-row{
  display:grid;
  grid-template-columns:120px 1fr auto;
  align-items:center;
  gap:12px;
  min-height:48px;
  padding:9px 12px;
  background:white;
  border:1px solid #e6ecf4;
  border-radius:12px;
}

.day-date{
  font-size:14px;
  font-weight:800;
  color:#50617b;
}

.day-status{
  font-size:14px;
  font-weight:800;
}

.day-time{
  color:var(--muted);
  font-size:13px;
  text-align:right;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.badge.present{background:#ecfdf3;color:var(--verde)}
.badge.late{background:#fffbeb;color:var(--amarillo)}
.badge.absent{background:#fff1f2;color:var(--rojo)}
.badge.pending{background:#eff6ff;color:var(--pendiente)}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

.note{
  margin-top:16px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

@media(max-width:900px){
  .form-grid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .student-head{
    grid-template-columns:40px minmax(0,1fr) 28px;
  }
  .student-summary{
    grid-column:2/3;
    justify-content:flex-start;
  }
  .student-head .chevron{
    grid-column:3;
    grid-row:1/3;
  }
}

@media(max-width:620px){
  .container{width:min(100% - 14px,1280px);margin:8px auto 30px}
  .filters,.report{padding:20px 16px}
  .title{font-size:24px}
  .form-grid{grid-template-columns:1fr}
  .actions button{width:100%}
  .report-head{flex-direction:column}
  .percent{align-self:flex-end}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .section-title{font-size:21px}
  .student-head{
    padding:14px 10px;
    grid-template-columns:34px minmax(0,1fr) 28px;
  }
  .student-name{font-size:15px}
  .mini{font-size:11px;padding:5px 7px}
  .student-overview{grid-template-columns:repeat(2,1fr)}
  .day-row{
    grid-template-columns:1fr auto;
    gap:7px;
  }
  .day-date{grid-column:1/-1}
  .day-time{text-align:right}
}
</style>
</head>

<body>
<div class="container">

  <section class="panel filters">
    <h1 class="title"><span>📊</span> Generar reporte</h1>

    <div class="form-grid">
      <div class="field">
        <label for="fechaInicio">Fecha de inicio</label>
        <input id="fechaInicio" type="date">
      </div>

      <div class="field">
        <label for="fechaFin">Fecha de fin</label>
        <input id="fechaFin" type="date">
      </div>

      <div class="field">
        <label for="grado">Grado</label>
        <select id="grado">
          <option value="5°">5°</option>
        </select>
      </div>

      <div class="field">
        <label for="seccion">Sección</label>
        <select id="seccion">
          <option value="J">J</option>
          <option value="C">C</option>
          <option value="G">G</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="btnGenerar" onclick="generarReporte()">📊 Generar reporte</button>
    </div>

    <div id="mensaje" class="message"></div>
  </section>

  <section id="resultado" class="panel report" style="display:none;"></section>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz4GruqdN5Fs57l3C_HQC0GF3tfqXmiGGqrTHuwkrntNgCKbCIbV0KdedUpqWZ84A0R/exec";

const fechaInicio = document.getElementById("fechaInicio");
const fechaFin = document.getElementById("fechaFin");
const grado = document.getElementById("grado");
const seccion = document.getElementById("seccion");
const btnGenerar = document.getElementById("btnGenerar");
const mensaje = document.getElementById("mensaje");
const resultado = document.getElementById("resultado");

function hoyISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatearFecha(texto){
  if(!texto) return "";
  const partes = texto.split("/");
  if(partes.length === 3){
    return `${partes[0]}/${partes[1]}/${partes[2]}`;
  }
  return texto;
}

function escapeHTML(valor){
  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function estadoInfo(estado){
  const e = String(estado || "").toLowerCase();

  if(e === "presente"){
    return { clase:"present", texto:"Presente", icono:"🟢" };
  }

  if(e === "tardanza"){
    return { clase:"late", texto:"Tardanza", icono:"🟡" };
  }

  if(e === "falta"){
    return { clase:"absent", texto:"Falta", icono:"🔴" };
  }

  return { clase:"pending", texto:"Pendiente", icono:"🔵" };
}

function contarEstados(asistencia){
  const r = {
    Presente:0,
    Tardanza:0,
    Falta:0,
    Pendiente:0
  };

  (asistencia || []).forEach(a=>{
    const e = String(a.estado || "Pendiente");
    if(e === "Presente") r.Presente++;
    else if(e === "Tardanza") r.Tardanza++;
    else if(e === "Falta") r.Falta++;
    else r.Pendiente++;
  });

  return r;
}

function porcentajeEstudiante(c){
  const jornadasCompletadas = c.Presente + c.Tardanza + c.Falta;

  if(!jornadasCompletadas && !c.Presente && !c.Tardanza){
    return 0;
  }

  const total = c.Presente + c.Tardanza + c.Falta + c.Pendiente;
  if(!total) return 0;

  return Math.round(((c.Presente + c.Tardanza) / total) * 100);
}

function fechaCorta(fecha){
  if(!fecha) return "";
  const p = String(fecha).split("/");
  if(p.length !== 3) return fecha;

  return `${p[0]}/${p[1]}`;
}

function abrirEstudiante(index){
  const el = document.getElementById("student-" + index);
  if(el) el.classList.toggle("open");
}

function renderEstudiante(est, index){
  const conteo = contarEstados(est.asistencia);
  const porcentaje = porcentajeEstudiante(conteo);

  const detalleDias = (est.asistencia || []).map(a=>{
    const info = estadoInfo(a.estado);

    return `
      <div class="day-row">
        <div class="day-date">
          📅 ${escapeHTML(a.fecha || "")}
        </div>

        <div class="day-status">
          <span class="badge ${info.clase}">
            ${info.icono} ${info.texto}
          </span>
        </div>

        <div class="day-time">
          ${a.hora ? "🕐 " + escapeHTML(a.hora) : "—"}
        </div>
      </div>
    `;
  }).join("");

  return `
    <article class="student" id="student-${index}">
      <div class="student-head" onclick="abrirEstudiante(${index})">

        <div class="student-number">
          ${String(index + 1).padStart(2,"0")}
        </div>

        <div class="student-name">
          ${escapeHTML(est.estudiante)}
        </div>

        <div class="student-summary">
          ${conteo.Presente ? `<span class="mini present">🟢 ${conteo.Presente}</span>` : ""}
          ${conteo.Tardanza ? `<span class="mini late">🟡 ${conteo.Tardanza}</span>` : ""}
          ${conteo.Falta ? `<span class="mini absent">🔴 ${conteo.Falta}</span>` : ""}
          ${conteo.Pendiente ? `<span class="mini pending">🔵 ${conteo.Pendiente}</span>` : ""}
        </div>

        <div class="chevron">⌄</div>
      </div>

      <div class="student-body">

        <div class="student-overview">
          <div class="overview-item green">
            <strong>${conteo.Presente}</strong>
            <small>Presentes</small>
          </div>

          <div class="overview-item yellow">
            <strong>${conteo.Tardanza}</strong>
            <small>Tardanzas</small>
          </div>

          <div class="overview-item red">
            <strong>${conteo.Falta}</strong>
            <small>Faltas</small>
          </div>

          <div class="overview-item blue">
            <strong>${conteo.Pendiente}</strong>
            <small>Pendientes</small>
          </div>
        </div>

        <div class="days">
          ${detalleDias || `<div class="empty">No hay jornadas registradas.</div>`}
        </div>

      </div>
    </article>
  `;
}

function mostrarMensaje(texto, tipo){
  mensaje.className = "message " + tipo;
  mensaje.textContent = texto;
}

async function generarReporte(){

  const inicio = fechaInicio.value;
  const fin = fechaFin.value;

  if(!inicio || !fin){
    mostrarMensaje("⚠️ Selecciona ambas fechas.", "error");
    return;
  }

  if(inicio > fin){
    mostrarMensaje("⚠️ La fecha de inicio no puede ser posterior a la fecha de fin.", "error");
    return;
  }

  btnGenerar.disabled = true;
  btnGenerar.textContent = "⏳ Generando...";

  resultado.style.display = "none";
  mostrarMensaje("Generando reporte...", "ok");

  try{

    const params = new URLSearchParams({
      action:"reporte",
      fechaInicio:inicio,
      fechaFin:fin,
      grado:grado.value,
      seccion:seccion.value
    });

    const respuesta = await fetch(API_URL + "?" + params.toString(), {
      method:"GET",
      cache:"no-store"
    });

    const data = await respuesta.json();

    if(!data.exito){
      throw new Error(data.mensaje || "No se pudo generar el reporte.");
    }

    renderReporte(data);
    mostrarMensaje("✓ Reporte generado correctamente.", "ok");

  }catch(error){

    resultado.style.display = "none";
    mostrarMensaje("❌ " + error.message, "error");

  }finally{

    btnGenerar.disabled = false;
    btnGenerar.textContent = "📊 Generar reporte";
  }
}

function renderReporte(data){

  const porcentaje = Number(data.porcentaje || 0);
  const estudiantes = Array.isArray(data.estudiantes) ? data.estudiantes : [];

  const periodoInicio = formatearFecha(data.fechaInicio);
  const periodoFin = formatearFecha(data.fechaFin);

  const mismoDia = periodoInicio === periodoFin;

  const tituloPeriodo = mismoDia
    ? `Periodo: ${periodoInicio}`
    : `Periodo: ${periodoInicio} → ${periodoFin}`;

  const lista = estudiantes.length
    ? estudiantes.map(renderEstudiante).join("")
    : `<div class="empty">No se encontraron estudiantes para los criterios seleccionados.</div>`;

  const jornadasTotales =
    Number(data.presentes || 0) +
    Number(data.tardanzas || 0) +
    Number(data.faltantes || 0) +
    Number(data.pendientes || 0);

  resultado.innerHTML = `
    <div class="report-head">
      <div>
        <h2>Reporte de asistencia · ${escapeHTML(data.grado)} · Sección ${escapeHTML(data.seccion)}</h2>
        <p class="period">${tituloPeriodo}</p>
      </div>

      <div class="percent">${porcentaje}%</div>
    </div>

    <div class="stats">

      <div class="stat green">
        <div class="number">${Number(data.presentes || 0)}</div>
        <div class="label"><span class="dot"></span>Presentes</div>
      </div>

      <div class="stat yellow">
        <div class="number">${Number(data.tardanzas || 0)}</div>
        <div class="label"><span class="dot"></span>Tardanzas</div>
      </div>

      <div class="stat red">
        <div class="number">${Number(data.faltantes || 0)}</div>
        <div class="label"><span class="dot"></span>Faltantes</div>
      </div>

      <div class="stat blue">
        <div class="number">${Number(data.pendientes || 0)}</div>
        <div class="label"><span class="dot"></span>Pendientes</div>
      </div>

      <div class="stat total">
        <div class="number">${Number(data.totalEstudiantes || estudiantes.length)}</div>
        <div class="label">👥 Estudiantes</div>
      </div>

    </div>

    <div class="progress">
      <div style="width:${Math.max(0,Math.min(100,porcentaje))}%"></div>
    </div>

    <h3 class="section-title">
      <span>👥</span>
      Detalle de estudiantes
    </h3>

    <div class="students">
      ${lista}
    </div>

    <div class="note">
      ${mismoDia
        ? "Cada estudiante muestra su estado del día seleccionado."
        : `El resumen superior corresponde a ${jornadasTotales} jornadas-estudiante. Abre un estudiante para ver su asistencia día por día.`}
    </div>
  `;

  resultado.style.display = "block";

  window.scrollTo({
    top:resultado.offsetTop - 15,
    behavior:"smooth"
  });
}

(function inicializar(){

  const hoy = hoyISO();

  fechaInicio.value = hoy;
  fechaFin.value = hoy;

  fechaFin.min = fechaInicio.value;

  fechaInicio.addEventListener("change",()=>{
    fechaFin.min = fechaInicio.value;

    if(fechaFin.value && fechaFin.value < fechaInicio.value){
      fechaFin.value = fechaInicio.value;
    }
  });

})();
</script>

</body>
</html>
