<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CET 34 - Ingresar</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./auth.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #f1f5f9
        );
      color: #172033;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contenedor {
      width: min(440px, 100%);
    }

    .tarjeta {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow:
        0 22px 60px rgba(15, 23, 42, .12);
    }

    .insignia {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insignia img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      color: #4a001d;
    }

    .subtitulo {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .estado {
      margin-top: 24px;
      padding: 16px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .estado-icono {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .estado-titulo {
      font-size: 17px;
      font-weight: 900;
    }

    .estado-texto {
      margin-top: 6px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .acciones {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button,
    .boton-enlace {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform .18s ease,
        background .18s ease;
    }

    button:active,
    .boton-enlace:active {
      transform: scale(.98);
    }

    .boton-ingresar {
      background: #78002f;
      color: #fff;
    }

    .boton-ingresar:hover {
      background: #620026;
    }

    .boton-salir {
      background: #f1f5f9;
      color: #172033;
      border: 1px solid #e2e8f0;
    }

    .boton-salir:hover {
      background: #e2e8f0;
    }

    .pie {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 11px;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <section class="tarjeta">

      <div class="insignia">
        <img
          src="./insignia-izquierda.png"
          alt="Insignia institucional CET 34"
        >
      </div>

      <h1>CET 34</h1>

      <div class="subtitulo">
        Sistema de Control de Asistencia Digital
      </div>

      <div class="estado">
        <div
          class="estado-icono"
          id="estadoIcono"
        >
          🔐
        </div>

        <div
          class="estado-titulo"
          id="estadoTitulo"
        >
          Acceso al sistema
        </div>

        <div
          class="estado-texto"
          id="estadoTexto"
        >
          Comprobando si ya existe una sesión en esta pestaña...
        </div>
      </div>

      <div class="acciones">

        <button
          type="button"
          class="boton-ingresar"
          id="btnIngresar"
        >
          🔑 Ingresar con Google
        </button>

        <button
          type="button"
          class="boton-salir oculto"
          id="btnCerrarSesion"
        >
          🚪 Cerrar sesión
        </button>

        <a
          class="boton-enlace boton-salir"
          href="./inicio.html"
        >
          🏠 Volver al inicio
        </a>

      </div>

      <div class="pie">
        CET 34 · Control de Asistencia QR
      </div>

    </section>
  </main>

  <script>
    (function () {

      "use strict";

      const icono =
        document.getElementById("estadoIcono");

      const titulo =
        document.getElementById("estadoTitulo");

      const texto =
        document.getElementById("estadoTexto");

      const btnIngresar =
        document.getElementById("btnIngresar");

      const btnCerrarSesion =
        document.getElementById("btnCerrarSesion");


      function mostrarSesion(usuario) {

        icono.textContent =
          "✅";

        titulo.textContent =
          "Sesión activa";

        texto.textContent =
          (
            usuario.nombre ||
            usuario.correo ||
            "Usuario autenticado"
          ) +
          (
            usuario.rol
              ? " · " + usuario.rol
              : ""
          );

        btnIngresar.classList.add(
          "oculto"
        );

        btnCerrarSesion.classList.remove(
          "oculto"
        );
      }


      function mostrarSinSesion() {

        icono.textContent =
          "🔐";

        titulo.textContent =
          "Acceso al sistema";

        texto.textContent =
          "Inicia sesión con una cuenta de Google autorizada para utilizar las funciones del sistema.";

        btnIngresar.classList.remove(
          "oculto"
        );

        btnCerrarSesion.classList.add(
          "oculto"
        );
      }


      async function comprobarSesion() {

        if (
          !window.CET34Auth
        ) {
          titulo.textContent =
            "Error de autenticación";

          texto.textContent =
            "No se pudo cargar auth.js.";

          btnIngresar.disabled =
            true;

          return;
        }

        try {

          const usuario =
            await CET34Auth.requireAuth({
              roles: [
                "ADMINISTRADOR",
                "DOCENTE"
              ],
              mensaje:
                "Verificando tu sesión CET34..."
            });

          mostrarSesion(usuario);

        } catch (error) {

          console.warn(
            "CET34 LOGIN:",
            error
          );

          mostrarSinSesion();
        }
      }


      btnIngresar.addEventListener(
        "click",
        async function () {

          if (
            !window.CET34Auth
          ) {
            return;
          }

          try {

            btnIngresar.disabled =
              true;

            texto.textContent =
              "Abriendo el acceso con Google...";

            await CET34Auth.login(false);

          } catch (error) {

            console.error(
              "CET34 LOGIN:",
              error
            );

          } finally {

            btnIngresar.disabled =
              false;

            setTimeout(
              comprobarSesion,
              700
            );
          }
        }
      );


      btnCerrarSesion.addEventListener(
        "click",
        async function () {

          if (
            !window.CET34Auth
          ) {
            return;
          }

          try {

            await CET34Auth.logout(
              false
            );

          } finally {

            mostrarSinSesion();

            titulo.textContent =
              "Sesión cerrada";

            texto.textContent =
              "La sesión CET34 se cerró correctamente. Puedes volver a ingresar cuando lo necesites.";
          }
        }
      );


      window.addEventListener(
        "cet34:sesion-cambio",
        function () {

          try {

            const usuario =
              CET34Auth.getUser();

            if (usuario) {
              mostrarSesion(usuario);
            } else {
              mostrarSinSesion();
            }

          } catch (_) {

            mostrarSinSesion();

          }

        }
      );


      document.addEventListener(
        "DOMContentLoaded",
        comprobarSesion
      );

    })();
  </script>

</body>
</html>
